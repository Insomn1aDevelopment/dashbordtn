<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Педагог сквозь цифру — Назарчук Т.Н.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <a class="brand" href="#/">
    <b>Назарчук<br>Татьяна Николаевна</b>
    <small>Педагог сквозь цифру</small>
  </a>
  <nav class="nav" id="nav">
    <a href="#/" data-page="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Обзор</span></a>
    <a href="#/timeline" data-page="timeline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Таймлайн</span></a>
    <a href="#/students" data-page="students"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg><span>Воспитанники</span></a>
    <a href="#/contests" data-page="contests"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg><span>Направления</span></a>
    <a href="#/gallery" data-page="gallery"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span>Галерея наград</span></a>
    <a href="#/teacher" data-page="teacher"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4.2-6.5 8-6.5s7 2.1 8 6.5"/></svg><span>О педагоге</span></a>
  </nav>
  <p class="side-foot">УО «Гродненский государственный колледж техники, технологий и дизайна»</p>
</aside>

<div class="shell">
  <header class="top">
    <div>
      <h1 id="pageTitle"></h1>
      <p id="pageSub"></p>
    </div>
    <button class="btn primary" id="addBtn">+ Добавить</button>
  </header>
  <nav class="years" id="years" aria-label="Учебный год"></nav>
  <main id="view"></main>
</div>

<div class="tip" id="tip" role="tooltip"></div>

<dialog id="detail" class="sheet">
  <button class="x" data-close aria-label="Закрыть">×</button>
  <div id="detailBody"></div>
</dialog>

<dialog id="viewer" class="viewer">
  <button class="x" data-close aria-label="Закрыть">×</button>
  <figure><img id="viewerImg" alt=""><figcaption id="viewerCap"></figcaption></figure>
  <div class="viewer-nav"><button id="prev" aria-label="Предыдущее">‹</button><span id="viewerN"></span><button id="next" aria-label="Следующее">›</button></div>
</dialog>

<dialog id="form" class="sheet form">
  <form method="dialog" id="addForm">
    <h2>Новое достижение</h2>
    <div class="row">
      <label>Учебный год<input name="year" required pattern="\d{4}-\d{4}" placeholder="2026-2027" list="yearList"></label>
      <label>Кто награждён<select name="kind"><option>учащиеся</option><option>педагог</option></select></label>
    </div>
    <label>Конкурс / мероприятие<input name="title" required></label>
    <div class="row">
      <label>Уровень<select name="level"><option>Международный</option><option>Республиканский</option><option selected>Областной</option><option>Городской</option><option>Колледжный</option></select></label>
      <label>Результат<select name="result"><option value="1">I место</option><option value="2">II место</option><option value="3">III место</option><option>Сертификат</option><option>Благодарность</option><option>Похвальный лист</option><option>Участие</option></select></label>
    </div>
    <label>Направление<select name="area" id="areaSelect"></select></label>
    <label>Номинация<input name="nomination"></label>
    <label>Работа / проект<input name="work"></label>
    <label>Учащиеся (через запятую)<input name="students"></label>
    <label>Фото дипломов<input name="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
    <label>Ключ администратора<input name="token" type="password" required autocomplete="current-password"></label>
    <p class="err" id="formErr"></p>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Отмена</button><button class="btn primary" id="saveBtn" value="save">Сохранить</button></div>
  </form>
  <datalist id="yearList"></datalist>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
